dependencies {
    implementation project(":eventuate-tram-spring-micrometer-tracing-starter")
    testImplementation project(":eventuate-tram-spring-micrometer-tracing-tests-common")

    // OpenTelemetry bridge
    testImplementation "io.micrometer:micrometer-tracing-bridge-otel"
    testImplementation "io.opentelemetry:opentelemetry-exporter-otlp:$openTelemetryVersion"
    testImplementation "io.opentelemetry:opentelemetry-sdk:$openTelemetryVersion"

    testImplementation "io.eventuate.tram.core:eventuate-tram-spring-in-memory"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc:$springBootVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test:$springBootVersion"
    testImplementation "org.springframework.boot:spring-boot-micrometer-tracing:$springBootVersion"
    testImplementation "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry:$springBootVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-opentelemetry:$springBootVersion"

    testImplementation "io.eventuate.util:eventuate-util-test:$eventuateUtilVersion"

    testImplementation "org.testcontainers:testcontainers:$testContainersVersion"

    testImplementation "tools.jackson.core:jackson-databind:$jacksonVersion"
}
